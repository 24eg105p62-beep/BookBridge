# =======================================================
# BOOKBRIDGE - Application Configuration
# Tech Stack: Spring Boot, Spring Data JPA, MySQL / H2
# =======================================================

spring.application.name=bookbridge-backend
server.port=8080

# -------------------------------------------------------
# Database Configuration
# Default: MySQL on port 3306
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookbridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# -------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true
spring.sql.init.mode=never

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
logging.level.com.bookbridge=DEBUG
logging.level.org.springframework.web=INFO
